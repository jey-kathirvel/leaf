<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ed5f4b"><title>Leaf is offline</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;color:#17352e;background:#fffaf1;font-family:system-ui,sans-serif}.offline{max-width:520px;text-align:center}.mark{display:grid;width:78px;height:78px;margin:0 auto 24px;place-items:center;border-radius:28px 28px 28px 8px;color:white;background:#168b70;font:600 42px Georgia,serif;box-shadow:7px 7px 0 #173f35}h1{margin:0 0 12px;font:600 clamp(38px,8vw,62px) Georgia,serif;line-height:1}p{color:#667770;line-height:1.7}button{margin-top:18px;padding:14px 20px;border:0;border-radius:6px;color:white;background:#ed5f4b;box-shadow:4px 4px 0 #173f35;font-weight:700;cursor:pointer}</style></head><body><main class="offline"><div class="mark">L</div><h1>You’re currently offline.</h1><p>Leaf needs an internet connection to load current products, inventory and your shopping information.</p><button type="button" onclick="location.reload()">Try again</button></main></body></html>
