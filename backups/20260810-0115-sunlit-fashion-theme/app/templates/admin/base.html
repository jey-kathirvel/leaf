<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Leaf Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css?v=aurora-1">
    {% block head %}{% endblock %}
</head>
<body class="admin-body">
    <div class="admin-aurora admin-aurora-one"></div>
    <div class="admin-aurora admin-aurora-two"></div>
    <header class="admin-compact-header">
        <a href="/admin" class="admin-sidebar-brand">
            <span class="admin-brand-logo"><svg viewBox="0 0 24 24"><path d="M19.8 3.2C13.3 3.5 7.1 6.1 5 11.1c-1.2 2.8-.2 5.5 1.7 7.1 1.4-3.8 4.3-6.8 8.3-8.8-3.2 2.6-5.5 5.8-6.6 9.5 2.2.8 4.9.2 6.8-1.8 3.5-3.7 4.4-9.2 4.6-13.9Z"/></svg></span>
            <span><strong>Leaf</strong><small>Administration</small></span>
        </a>
        <nav>
            <a href="/admin">Dashboard</a>
            <a href="/admin/categories">Categories</a>
            <a href="/admin/products">Products</a>
            <a href="/admin/inventory">Inventory</a>
            <a href="/admin/orders">Orders</a>
            <a href="/admin/customers">Customers</a>
            <a href="/">Storefront</a>
        </nav>
        <form method="post" action="/admin/logout"><button type="submit">Sign out</button></form>
    </header>
    <main class="admin-content-shell">{% block content %}{% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
