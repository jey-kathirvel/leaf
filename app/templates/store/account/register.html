{% extends "layouts/store_base.html" %}{% block title %}Create Account | Leaf{% endblock %}{% block content %}<section class="account-auth-section"><div class="account-auth-card register-card"><span class="eyebrow"><span class="eyebrow-dot"></span> Join Leaf</span><h1>Create your account</h1><p>Your guest orders will appear automatically when the email matches.</p>{% if error %}<div class="store-alert error">{{ error }}</div>{% endif %}<form method="post" action="/register" class="account-form form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>First name<input name="first_name" required minlength="2" autocomplete="given-name"></label><label>Last name<input name="last_name" autocomplete="family-name"></label><label class="wide">Email address<input type="email" name="email" required autocomplete="email"></label><label class="wide">Mobile number<input name="mobile" required maxlength="10" inputmode="numeric" autocomplete="tel"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="new-password"></label><label>Confirm password<input type="password" name="password_confirm" required minlength="10" autocomplete="new-password"></label><button class="button button-primary full-button wide">Create account</button></form><p class="account-switch">Already registered? <a href="/login">Sign in</a></p></div></section>{% endblock %}
