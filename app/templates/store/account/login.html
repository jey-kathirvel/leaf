{% extends "layouts/store_base.html" %}{% block title %}Customer Login | Leaf{% endblock %}{% block content %}<section class="account-auth-section"><div class="account-auth-card"><span class="eyebrow"><span class="eyebrow-dot"></span> Welcome back</span><h1>Sign in to Leaf</h1><p>View your orders and delivery updates.</p>{% if error %}<div class="store-alert error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-primary full-button">Sign in</button></form><p class="account-switch">New to Leaf? <a href="/register">Create an account</a></p></div></section>{% endblock %}
