{% extends "layouts/store_base.html" %}
{% block title %}Choose New Password | Leaf{% endblock %}
{% block content %}
<section class="account-auth-section">
  <div class="account-auth-card">
    <span class="eyebrow"><span class="eyebrow-dot"></span> Secure reset</span>
    <h1>Choose a new password</h1>
    <p>Use at least 10 characters for your new Leaf password.</p>
    {% if error %}<div class="store-alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/reset-password" class="account-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ reset_token }}">
      <label>New password<input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
      <label>Confirm new password<input type="password" name="password_confirm" required minlength="10" autocomplete="new-password"></label>
      <button class="button button-primary full-button">Update password</button>
    </form>
    <p class="account-switch"><a href="/login">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
