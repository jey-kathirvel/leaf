<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Leaf is offline</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;color:#111827;background:radial-gradient(circle at 15% 15%,#dbeafe,transparent 34%),radial-gradient(circle at 85% 20%,#ede9fe,transparent 36%),#f4f7fb;font-family:Inter,system-ui,sans-serif}.offline{max-width:520px;padding:40px;border:1px solid rgba(255,255,255,.85);border-radius:30px;background:rgba(255,255,255,.65);box-shadow:0 30px 80px rgba(49,46,129,.14);text-align:center}.mark{display:grid;width:78px;height:78px;margin:0 auto 24px;place-items:center;border-radius:24px;color:white;background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);font:800 38px system-ui;box-shadow:0 16px 34px rgba(79,70,229,.26)}h1{margin:0 0 12px;font-size:clamp(36px,8vw,58px);line-height:1;letter-spacing:-.05em}p{color:#667085;line-height:1.7}button{margin-top:18px;padding:14px 20px;border:0;border-radius:14px;color:white;background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);box-shadow:0 14px 30px rgba(79,70,229,.24);font-weight:800;cursor:pointer}</style></head><body><main class="offline"><div class="mark">L</div><h1>You’re currently offline.</h1><p>Reconnect to load current products, inventory and shopping information.</p><button type="button" onclick="location.reload()">Try again</button></main></body></html>
